<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlockWorld Online</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial,sans-serif}
#ui{position:fixed;inset:0;pointer-events:none;color:white;text-shadow:1px 2px 3px #222}
#top{position:absolute;top:12px;left:12px;background:#0008;padding:12px 16px;border-radius:12px}
#help{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);background:#0009;padding:10px 16px;border-radius:10px;text-align:center;white-space:nowrap}
#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:24px}
#status{position:absolute;top:12px;right:12px;background:#0008;padding:10px;border-radius:10px}
#start{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:5;color:white}
#panel{background:#222e;padding:30px;border:2px solid #ffffff55;border-radius:18px;text-align:center;max-width:90%}
button{padding:12px 24px;font-size:18px;font-weight:bold;border:0;border-radius:10px;background:#4caf50;color:white;cursor:pointer}
#message{margin-top:10px;color:#ffec99}
</style>
</head>
<body>
<div id="ui">
  <div id="top">
    <b>🧊 BlockWorld Online</b><br>
    위치: <span id="pos">0, 0, 0</span><br>
    블록: <span id="count">0</span>
  </div>
  <div id="status">WASD 이동 · Space 점프</div>
  <div id="crosshair">＋</div>
  <div id="help">WASD 이동 | 마우스 시점 | Space 점프 | 좌클릭 블록 제거 | 우클릭 블록 설치</div>
</div>

<div id="start">
  <div id="panel">
    <h1>🧊 BlockWorld Online</h1>
    <p>블록 세계를 탐험하고 직접 건축해 봐!</p>
    <p>WASD 이동 · Space 점프 · 마우스 시점</p>
    <button id="play">게임 시작</button>
    <div id="message"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
"use strict";

const scene = new THREE.Scene();
scene.background = new THREE.Color("#87ceeb");
scene.fog = new THREE.Fog("#87ceeb", 60, 180);

const camera = new THREE.PerspectiveCamera(
  75, window.innerWidth / window.innerHeight, 0.1, 300
);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x65734c, 2));

const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(30, 60, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
scene.add(sun);

const materials = {
  grass: new THREE.MeshStandardMaterial({color:"#65b95d"}),
  dirt: new THREE.MeshStandardMaterial({color:"#8b5a2b"}),
  stone: new THREE.MeshStandardMaterial({color:"#888888"}),
  wood: new THREE.MeshStandardMaterial({color:"#9a6538"}),
  leaves: new THREE.MeshStandardMaterial({color:"#26843b"}),
  sand: new THREE.MeshStandardMaterial({color:"#e5d18c"})
};

const blocks = [];
const blockMap = new Map();
const blockGeometry = new THREE.BoxGeometry(1,1,1);
const worldGroup = new THREE.Group();
scene.add(worldGroup);

const keyOf = (x,y,z) => `${x},${y},${z}`;

function addBlock(x,y,z,type="grass") {
  x=Math.round(x); y=Math.round(y); z=Math.round(z);
  const key=keyOf(x,y,z);
  if(blockMap.has(key)) return null;

  const material=materials[type] || materials.grass;
  const mesh=new THREE.Mesh(blockGeometry,material);
  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  mesh.userData={x,y,z,type,isBlock:true};

  worldGroup.add(mesh);
  blockMap.set(key,mesh);
  blocks.push(mesh);
  return mesh;
}

function removeBlock(mesh) {
  if(!mesh || !mesh.userData.isBlock) return;
  const d=mesh.userData;
  blockMap.delete(keyOf(d.x,d.y,d.z));
  worldGroup.remove(mesh);
  const i=blocks.indexOf(mesh);
  if(i!==-1) blocks.splice(i,1);
}

function makeTree(x,z) {
  const h=2+Math.floor(Math.random()*2);
  for(let y=1;y<=h;y++) addBlock(x,y,z,"wood");

  for(let dx=-2;dx<=2;dx++) {
    for(let dz=-2;dz<=2;dz++) {
      for(let dy=h;dy<=h+2;dy++) {
        if(Math.abs(dx)+Math.abs(dz)+Math.abs(dy-h)<=4 &&
           Math.random()>.12) {
          addBlock(x+dx,dy,z+dz,"leaves");
        }
      }
    }
  }
}

function makeWorld() {
  // 바닥을 넓고 연속적으로 생성
  for(let x=-30;x<=30;x++) {
    for(let z=-30;z<=30;z++) {
      addBlock(x,-1,z,"dirt");
      addBlock(x,0,z,"grass");
    }
  }

  // 주변 지형
  for(let i=0;i<90;i++) {
    const x=Math.floor(Math.random()*55)-27;
    const z=Math.floor(Math.random()*55)-27;
    if(Math.abs(x)<5 && Math.abs(z)<5) continue;

    if(Math.random()<.55) {
      const height=1+Math.floor(Math.random()*4);
      for(let y=1;y<=height;y++) {
        addBlock(x,y,z,Math.random()<.5?"stone":"dirt");
      }
    } else {
      makeTree(x,z);
    }
  }

  // 시작 지점 주변을 평평하게 유지
  for(let x=-3;x<=3;x++) {
    for(let z=-3;z<=3;z++) {
      for(let y=1;y<=8;y++) {
        removeBlock(blockMap.get(keyOf(x,y,z)));
      }
      addBlock(x,-1,z,"dirt");
      addBlock(x,0,z,"grass");
    }
  }
}
makeWorld();

const player = {
  x:0, y:2.01, z:0,
  vy:0,
  grounded:false,
  height:1.8,
  radius:.3,
  speed:6
};

let yaw=0, pitch=0;
let playing=false;
let selectedType="grass";
const keys={};
const raycaster=new THREE.Raycaster();
const center=new THREE.Vector2(0,0);

function getBlockAt(x,y,z) {
  return blockMap.get(keyOf(Math.round(x),Math.round(y),Math.round(z)));
}

function overlapsBlock(px,py,pz,mesh) {
  const d=mesh.userData;
  return px+player.radius>d.x-.5 &&
         px-player.radius<d.x+.5 &&
         pz+player.radius>d.z-.5 &&
         pz-player.radius<d.z+.5 &&
         py<d.y+.5 &&
         py+player.height>d.y-.5;
}

function collidesAt(px,py,pz) {
  const minX=Math.floor(px-player.radius-.5);
  const maxX=Math.floor(px+player.radius+.5);
  const minY=Math.floor(py-.5);
  const maxY=Math.floor(py+player.height+.5);
  const minZ=Math.floor(pz-player.radius-.5);
  const maxZ=Math.floor(pz+player.radius+.5);

  for(let x=minX;x<=maxX;x++) {
    for(let y=minY;y<=maxY;y++) {
      for(let z=minZ;z<=maxZ;z++) {
        const mesh=getBlockAt(x,y,z);
        if(mesh && overlapsBlock(px,py,pz,mesh)) return true;
      }
    }
  }
  return false;
}

function findLanding(px,pz,oldY,newY) {
  let best=-Infinity;

  const minX=Math.floor(px-player.radius-.5);
  const maxX=Math.floor(px+player.radius+.5);
  const minZ=Math.floor(pz-player.radius-.5);
  const maxZ=Math.floor(pz+player.radius+.5);

  for(let x=minX;x<=maxX;x++) {
    for(let z=minZ;z<=maxZ;z++) {
      const mesh=getBlockAt(x,0,z);
      // 모든 높이의 블록을 확인
      for(let y=-1;y<=20;y++) {
        const b=getBlockAt(x,y,z);
        if(!b) continue;

        const d=b.userData;
        const insideX=px+player.radius>d.x-.5 &&
                      px-player.radius<d.x+.5;
        const insideZ=pz+player.radius>d.z-.5 &&
                      pz-player.radius<d.z+.5;
        const top=d.y+.5;

        if(insideX && insideZ &&
           oldY>=top-.08 && newY<=top &&
           player.vy<=0) {
          best=Math.max(best,top);
        }
      }
    }
  }
  return best;
}

function updateCamera() {
  camera.position.set(
    player.x,
    player.y+1.55,
    player.z
  );
  camera.rotation.order="YXZ";
  camera.rotation.y=yaw;
  camera.rotation.x=pitch;
}

function moveAxis(dx,dz) {
  const nx=player.x+dx;
  if(!collidesAt(nx,player.y,player.z)) player.x=nx;

  const nz=player.z+dz;
  if(!collidesAt(player.x,player.y,nz)) player.z=nz;
}

function updatePlayer(dt) {
  const forward=(keys.KeyW?1:0)-(keys.KeyS?1:0);
  const side=(keys.KeyD?1:0)-(keys.KeyA?1:0);
  const len=Math.hypot(forward,side)||1;

  const speed=player.speed;
  const dx=(Math.sin(yaw)*forward+Math.cos(yaw)*side)*speed*dt/len;
  const dz=(Math.cos(yaw)*forward-Math.sin(yaw)*side)*speed*dt/len;

  moveAxis(dx,dz);

  if(keys.Space && player.grounded) {
    player.vy=8.5;
    player.grounded=false;
  }

  const oldY=player.y;
  player.vy=Math.max(player.vy-22*dt,-45);
  let newY=oldY+player.vy*dt;

  const land=findLanding(player.x,player.z,oldY,newY);

  if(land!==-Infinity && player.vy<=0 && newY<=land) {
    newY=land;
    player.vy=0;
    player.grounded=true;
  } else {
    player.grounded=false;
  }

  if(!collidesAt(player.x,newY,player.z)) {
    player.y=newY;
  } else if(player.vy>0) {
    player.vy=0;
  } else {
    // 충돌이 발생하면 이전의 안전한 높이를 유지
    player.y=oldY;
    player.vy=0;
    player.grounded=true;
  }

  // 월드 바깥으로 떨어졌을 때 시작 지점으로 복귀
  if(player.y < -25) {
    player.x=0;
    player.y=2.01;
    player.z=0;
    player.vy=0;
    player.grounded=false;
  }

  document.getElementById("pos").textContent =
    `${player.x.toFixed(1)}, ${player.y.toFixed(1)}, ${player.z.toFixed(1)}`;

  document.getElementById("count").textContent=blocks.length;
}

function getTargetBlock() {
  raycaster.setFromCamera(center,camera);
  const hits=raycaster.intersectObjects(blocks,false);
  return hits.length && hits[0].distance<7 ? hits[0] : null;
}

function mineBlock() {
  const hit=getTargetBlock();
  if(!hit) return;
  const mesh=hit.object;
  if(mesh.userData.y<=0) {
    document.getElementById("message").textContent="바닥 블록은 제거할 수 없어!";
    return;
  }
  removeBlock(mesh);
  document.getElementById("count").textContent=blocks.length;
}

function placeBlock() {
  const hit=getTargetBlock();
  if(!hit) return;

  const normal=hit.face.normal.clone()
    .transformDirection(hit.object.matrixWorld);

  const d=hit.object.userData;
  const x=d.x+Math.round(normal.x);
  const y=d.y+Math.round(normal.y);
  const z=d.z+Math.round(normal.z);

  const mesh=addBlock(x,y,z,selectedType);
  if(mesh && overlapsBlock(player.x,player.y,player.z,mesh)) {
    removeBlock(mesh);
  }
  document.getElementById("count").textContent=blocks.length;
}

document.getElementById("play").addEventListener("click",()=>{
  playing=true;
  document.getElementById("start").style.display="none";
  renderer.domElement.requestPointerLock();
});

document.addEventListener("pointerlockchange",()=>{
  if(document.pointerLockElement!==renderer.domElement && playing) {
    document.getElementById("start").style.display="flex";
  }
});

document.addEventListener("mousemove",e=>{
  if(document.pointerLockElement!==renderer.domElement) return;
  yaw-=e.movementX*.002;
  pitch-=e.movementY*.002;
  pitch=Math.max(-1.5,Math.min(1.5,pitch));
});

document.addEventListener("keydown",e=>{
  keys[e.code]=true;
  if(e.code==="Space") e.preventDefault();

  if(e.code==="Digit1") selectedType="grass";
  if(e.code==="Digit2") selectedType="dirt";
  if(e.code==="Digit3") selectedType="stone";
  if(e.code==="Digit4") selectedType="wood";
  if(e.code==="Digit5") selectedType="leaves";
});

document.addEventListener("keyup",e=>keys[e.code]=false);

document.addEventListener("mousedown",e=>{
  if(document.pointerLockElement!==renderer.domElement) return;
  if(e.button===0) mineBlock();
  if(e.button===2) placeBlock();
});

document.addEventListener("contextmenu",e=>e.preventDefault());

window.addEventListener("blur",()=>{
  for(const k in keys) keys[k]=false;
});

window.addEventListener("resize",()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

let last=performance.now();

function animate(now) {
  requestAnimationFrame(animate);
  const dt=Math.min((now-last)/1000,.033);
  last=now;

  if(playing) {
    updatePlayer(dt);
    updateCamera();
  }

  renderer.render(scene,camera);
}

updateCamera();
requestAnimationFrame(animate);
})();
</script>
</body>
</html>
